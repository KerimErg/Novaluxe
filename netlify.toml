# Déploiement Netlify pour Next.js.
# Netlify installe automatiquement l'adaptateur Next.js (@netlify/plugin-nextjs) :
# rendu serveur, routes API et images fonctionnent sans autre réglage.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
